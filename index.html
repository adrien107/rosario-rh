<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RH — Suivi salariés — Rosario</title>
<style>
  :root {
    --ink: #1c1a17;
    --paper: #faf7f2;
    --card: #ffffff;
    --line: #e4ddd1;
    --accent: #b3401f;
    --accent-soft: #f4e2da;
    --ok: #4c7a4c;
    --muted: #8a8378;
    --success: #2f6d46;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding: 24px 16px 80px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { margin-bottom: 24px; }
  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 11px;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 6px;
  }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 14px; margin: 0; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    margin: 0 0 14px;
  }

  a.employee-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 10px;
    text-decoration: none;
    color: var(--ink);
  }
  a.employee-card:hover { border-color: var(--accent); }
  .employee-name { font-size: 15.5px; font-weight: 700; }
  .employee-role { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .employee-arrow { color: var(--muted); font-size: 18px; flex-shrink: 0; }

  .empty-state, .error-state { color: var(--muted); font-size: 13.5px; text-align: center; padding: 20px 4px; }
  .error-state { color: var(--accent); }

  footer { text-align: center; font-size: 11px; color: var(--muted); margin-top: 24px; }
  .brand-mark { display: block; height: 30px; width: auto; margin: 0 auto 10px; }

  .pin-screen {
    position: fixed;
    inset: 0;
    background: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 300;
    padding: 24px;
  }
  .pin-screen.hidden { display: none; }
  .pin-wrap { max-width: 320px; width: 100%; text-align: center; }
  .pin-eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 11px;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .pin-title { font-size: 22px; margin: 0 0 6px; }
  .pin-sub { color: var(--muted); font-size: 13.5px; margin: 0 0 24px; }
  .pin-input {
    width: 100%;
    text-align: center;
    letter-spacing: 0.5em;
    font-size: 24px;
    padding: 14px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    color: var(--ink);
    margin-bottom: 14px;
    font-family: inherit;
  }
  .pin-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .pin-submit {
    width: 100%;
    padding: 13px 16px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .pin-error { color: var(--accent); font-size: 12.5px; margin-top: 12px; min-height: 16px; }
</style>
</head>
<body>

<div class="pin-screen" id="pinScreen">
  <div class="pin-wrap">
    <div class="pin-eyebrow">Rosario · Accès RH</div>
    <h2 class="pin-title">Mot de passe</h2>
    <p class="pin-sub">Réservé à la direction</p>
    <input type="password" class="pin-input" id="pinInput" placeholder="Mot de passe" style="letter-spacing:normal; font-size:16px;">
    <button type="button" class="pin-submit" id="pinSubmitBtn">Déverrouiller</button>
    <p class="pin-error" id="pinErrorText"></p>
  </div>
</div>

<div class="wrap">

<script>
  // ---------- Config : à compléter après déploiement de l'Apps Script ----------
  const APPS_SCRIPT_URL = "PASTE_APPS_SCRIPT_URL_HERE";
  const ACCESS_KEY = "CHANGE_MOI_4040";

  const employeeListEl = document.getElementById("employeeList");

  function loadRoster() {
    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("PASTE_") === 0) {
      employeeListEl.innerHTML = '<div class="error-state">Apps Script pas encore configuré : colle l\'URL de déploiement dans APPS_SCRIPT_URL en haut du fichier.</div>';
      return;
    }
    fetch(APPS_SCRIPT_URL + "?action=roster&key=" + encodeURIComponent(ACCESS_KEY))
      .then(r => r.json())
      .then(data => {
        if (data.error) { employeeListEl.innerHTML = '<div class="error-state">' + data.error + '</div>'; return; }
        if (!data.length) { employeeListEl.innerHTML = '<div class="empty-state">Aucun salarié dans le roster.</div>'; return; }
        employeeListEl.innerHTML = "";
        data.forEach(emp => {
          const a = document.createElement("a");
          a.className = "employee-card";
          a.href = "fiche.html?id=" + encodeURIComponent(emp.id);
          a.innerHTML = '<div><div class="employee-name"></div><div class="employee-role"></div></div><span class="employee-arrow">›</span>';
          a.querySelector(".employee-name").textContent = emp.nom;
          a.querySelector(".employee-role").textContent = emp.poste || "—";
          employeeListEl.appendChild(a);
        });
      })
      .catch(() => {
        employeeListEl.innerHTML = '<div class="error-state">Connexion impossible à l\'Apps Script.</div>';
      });
  }
  loadRoster();

  // ---------- PIN gate ----------
  (function () {
    // Mot de passe partagé avec la direction (ex: futur directeur). À changer ici
    // avant déploiement, et à communiquer de vive voix — pas par écrit non chiffré.
    const PASSWORD = "Barcelona2025!";
    const pinScreen = document.getElementById("pinScreen");
    const pinInput = document.getElementById("pinInput");
    const pinSubmitBtn = document.getElementById("pinSubmitBtn");
    const pinErrorText = document.getElementById("pinErrorText");

    if (sessionStorage.getItem("rosario_rh_unlocked") === "1") {
      pinScreen.classList.add("hidden");
    } else {
      pinInput.focus();
    }
    function tryUnlock() {
      if (pinInput.value === PASSWORD) {
        sessionStorage.setItem("rosario_rh_unlocked", "1");
        pinScreen.classList.add("hidden");
        pinErrorText.textContent = "";
      } else {
        pinErrorText.textContent = "Code incorrect.";
        pinInput.value = "";
        pinInput.focus();
      }
    }
    pinSubmitBtn.addEventListener("click", tryUnlock);
    pinInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); tryUnlock(); } });
  })();
</script>
