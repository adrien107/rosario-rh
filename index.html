<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RH — Suivi salariés — Rosario</title>
<style>
  :root {
    --ink: #1c1a17;
    --paper: #faf7f2;
    --card: #ffffff;
    --line: #e4ddd1;
    --accent: #b3401f;
    --accent-soft: #f4e2da;
    --ok: #4c7a4c;
    --muted: #8a8378;
    --success: #2f6d46;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding: 24px 16px 80px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { margin-bottom: 24px; }
  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 11px;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 6px;
  }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 14px; margin: 0; }
  .demo-banner {
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 12.5px;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 20px;
    text-align: center;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    margin: 0 0 14px;
  }

  a.employee-card {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 10px;
    text-decoration: none;
    color: var(--ink);
  }
  a.employee-card:hover { border-color: var(--accent); }
  .employee-main { flex: 1; min-width: 0; }
  .employee-name { font-size: 15.5px; font-weight: 700; }
  .employee-role { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .employee-arrow { color: var(--muted); font-size: 18px; flex-shrink: 0; margin-top: 2px; }
  .employee-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
  .meta-item { font-size: 12px; color: var(--muted); }
  .meta-badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .meta-warning { background: var(--accent-soft); color: var(--accent); }
  .meta-ok { background: #e4efe5; color: var(--success); }
  .meta-neutral, .meta-unknown { background: #efece4; color: var(--muted); }
  .employee-progress { font-size: 12px; color: var(--muted); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  .employee-progress strong { color: var(--ink); font-weight: 600; }

  .empty-state, .error-state { color: var(--muted); font-size: 13.5px; text-align: center; padding: 20px 4px; }
  .error-state { color: var(--accent); }

  footer { text-align: center; font-size: 11px; color: var(--muted); margin-top: 24px; }

  .pin-screen {
    position: fixed;
    inset: 0;
    background: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 300;
    padding: 24px;
  }
  .pin-screen.hidden { display: none; }
  .pin-wrap { max-width: 320px; width: 100%; text-align: center; }
  .pin-eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 11px;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .pin-title { font-size: 22px; margin: 0 0 6px; }
  .pin-sub { color: var(--muted); font-size: 13.5px; margin: 0 0 24px; }
  .pin-input {
    width: 100%;
    text-align: center;
    letter-spacing: 0.5em;
    font-size: 24px;
    padding: 14px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    color: var(--ink);
    margin-bottom: 14px;
    font-family: inherit;
  }
  .pin-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .pin-submit {
    width: 100%;
    padding: 13px 16px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .pin-error { color: var(--accent); font-size: 12.5px; margin-top: 12px; min-height: 16px; }
</style>
</head>
<body>

<div class="pin-screen" id="pinScreen">
  <div class="pin-wrap">
    <div class="pin-eyebrow">Rosario · Accès RH</div>
    <h2 class="pin-title">Mot de passe</h2>
    <p class="pin-sub">Réservé à la direction</p>
    <input type="password" class="pin-input" id="pinInput" placeholder="Mot de passe" style="letter-spacing:normal; font-size:16px;">
    <button type="button" class="pin-submit" id="pinSubmitBtn">Déverrouiller</button>
    <p class="pin-error" id="pinErrorText"></p>
  </div>
</div>

<div class="wrap">
  <header>
    <div class="eyebrow">Rosario · RH</div>
    <h1>Suivi salariés</h1>
    <p class="subtitle">Grupo Domingo — liste des salariés actuels</p>
  </header>

  <div class="card">
    <p class="card-title">Salle</p>
    <div id="employeeListSalle">
      <div class="empty-state">Chargement…</div>
    </div>
  </div>

  <div class="card">
    <p class="card-title">Bar</p>
    <div id="employeeListBar">
      <div class="empty-state">Chargement…</div>
    </div>
  </div>

  <div class="card">
    <p class="card-title">Manager</p>
    <div id="employeeListManager">
      <div class="empty-state">Chargement…</div>
    </div>
  </div>

  <footer>Domingo — Rosario · usage interne</footer>
</div>

<script>
  // ---------- Config ----------
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6bPoHUyJGy3hdifKdDCG2BKP3riT_tYkxKC7pWeTu4X7RfjMWF11Mm6efBbktwxU/exec";
  const ACCESS_KEY = "Barcelona2025!";

  const employeeListSalleEl = document.getElementById("employeeListSalle");
  const employeeListBarEl = document.getElementById("employeeListBar");
  const employeeListManagerEl = document.getElementById("employeeListManager");

  // Postes considérés comme "Bar" et "Manager" ; tout le reste (Chef de rang, Runner, etc.) = "Salle".
  const BAR_POSTES = ["Barman", "Barmaid", "Bartender"];
  const MANAGER_POSTES = ["Manager"];
  function isBar(emp) { return BAR_POSTES.indexOf(emp.poste) !== -1; }
  function isManager(emp) { return MANAGER_POSTES.indexOf(emp.poste) !== -1; }

  // ---------- Période d'essai (identique au calcul de fiche.html, version condensée) ----------
  const ESSAI_INITIAL = { "Employé": 2, "Agent de maîtrise": 3, "Cadre": 4 };
  const ESSAI_MAX_RENEWED = { "Employé": 4, "Agent de maîtrise": 6, "Cadre": 8 };
  function addMonths(date, months) { const d = new Date(date.getTime()); d.setMonth(d.getMonth() + months); return d; }
  function fmtDateFr(d) { return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "long", year: "numeric" }); }

  function essaiInfo(emp) {
    if (emp.essaiValidee === "oui") return { label: "Période d'essai validée", cls: "meta-ok" };
    if (emp.essaiValidee === "non") return { label: "Période d'essai non validée", cls: "meta-warning" };
    if (!emp.dateRecrutement) return { label: "Date d'arrivée non renseignée", cls: "meta-unknown" };

    const hireDate = new Date(emp.dateRecrutement + "T00:00:00");
    const typeContrat = emp.typeContrat || "CDI";
    const categorie = emp.categorie || "Employé";
    let initialEnd, maxEnd;

    if (typeContrat === "CDD") {
      if (!emp.dateFinCDD) return { label: "Période d'essai : date de fin CDD manquante", cls: "meta-unknown" };
      const cddEnd = new Date(emp.dateFinCDD + "T00:00:00");
      const contractDays = Math.round((cddEnd - hireDate) / 86400000);
      const essaiDays = contractDays <= 183 ? Math.min(Math.ceil(contractDays / 7), 14) : 30;
      initialEnd = new Date(hireDate.getTime() + essaiDays * 86400000);
      maxEnd = initialEnd;
    } else {
      const initMonths = ESSAI_INITIAL[categorie] || ESSAI_INITIAL["Employé"];
      const maxMonths = ESSAI_MAX_RENEWED[categorie] || ESSAI_MAX_RENEWED["Employé"];
      initialEnd = addMonths(hireDate, initMonths);
      maxEnd = addMonths(hireDate, maxMonths);
    }

    const now = new Date();
    if (now < initialEnd) return { label: "Période d'essai en cours (fin " + fmtDateFr(initialEnd) + ")", cls: "meta-warning" };
    if (now < maxEnd) return { label: "Période d'essai terminée (renouvelable)", cls: "meta-neutral" };
    return { label: "Période d'essai terminée", cls: "meta-ok" };
  }

  // Provisoire côté client : tant que le nouveau backend .gs (qui filtre déjà
  // Hiring-Front côté serveur) n'est pas redéployé sur Apps Script, on exclut
  // ici les salariés cuisine / Hiring-Back pour que l'aperçu soit correct.
  const NON_HIRING_FRONT_IDS = ["elena-misiego", "nicola-baron", "lucia-curiel", "ivan", "kartika", "sofia", "godwin", "baby-john"];

  // Salariés qui ne sont pas "Current" + "Hired" dans l'onglet Hiring-Front
  // (Léa Benoît, Yohan Doudié et Sarah Auber-Yvars y sont marqués "Old" ;
  // Mathurin Jeannes n'y apparaît pas). Pablo Acevedo et Lucas Rohan sont
  // gardés à la demande d'Adrien même s'ils ne matchent pas Current+Hired.
  const NOT_CURRENT_HIRED_IDS = ["lea-benoit", "yohan-doudie", "sarah-auber-yvars", "mathurin-jeannes"];

  // Dates de recrutement absentes du roster côté Sheet, données par Adrien.
  // Provisoire côté client tant que la Sheet elle-même n'a pas ces cellules
  // remplies (colonne DateRecrutement, onglet Roster).
  const DATE_OVERRIDES = { "lucas-rohan": "2026-08-19", "pablo-acevedo": "2026-07-25" };
  function applyDateOverrides(list) {
    list.forEach(emp => { if (!emp.dateRecrutement && DATE_OVERRIDES[emp.id]) emp.dateRecrutement = DATE_OVERRIDES[emp.id]; });
    return list;
  }

  // Pablo Acevedo et Pablo Castrillon sont en fait la même personne (Pablo
  // Acevedo Castrillon, Chef de rang) — confirmé par Adrien le 2026-08-10.
  // Provisoire côté client tant qu'Adrien n'a pas exécuté mergePabloDuplicate()
  // côté Apps Script : on renomme "pablo-acevedo" et on retire le doublon
  // "pablo-castrillon" de la liste.
  const NAME_OVERRIDES = { "pablo-acevedo": "Pablo Acevedo Castrillon" };
  const MERGED_DUPLICATE_IDS = ["pablo-castrillon"];
  function applyNameOverrides(list) {
    list.forEach(emp => { if (NAME_OVERRIDES[emp.id]) emp.nom = NAME_OVERRIDES[emp.id]; });
    return list;
  }

  // Gustavo Meaurio, communiqué par Adrien le 2026-08-10, absent du roster
  // Google Sheet pour l'instant. Provisoire côté client tant qu'Adrien n'a pas
  // exécuté addGustavoMeaurio() côté Apps Script : on l'injecte ici pour que
  // l'aperçu soit correct, uniquement s'il n'est pas déjà remonté par l'API
  // (pour ne pas le dupliquer une fois ajouté côté Sheet).
  const SYNTHETIC_EMPLOYEES = [
    { id: "gustavo-meaurio", nom: "Gustavo Meaurio", poste: "Manager", categorie: "", typeContrat: "CDI", dateRecrutement: "2025-10-23", dateFinCDD: "", essaiValidee: "oui", statut: "Actif", notes: "" },
  ];
  function applySyntheticEmployees(list) {
    SYNTHETIC_EMPLOYEES.forEach(synth => {
      if (!list.some(emp => emp.id === synth.id)) list.push(synth);
    });
    return list;
  }

  function sortByAnciennete(list) {
    list.sort((a, b) => {
      if (!a.dateRecrutement && !b.dateRecrutement) return 0;
      if (!a.dateRecrutement) return 1;
      if (!b.dateRecrutement) return -1;
      return new Date(a.dateRecrutement) - new Date(b.dateRecrutement);
    });
    return list;
  }

  function renderList(el, list) {
    if (!list.length) { el.innerHTML = '<div class="empty-state">Aucun salarié.</div>'; return; }
    el.innerHTML = "";
    list.forEach(emp => el.appendChild(renderEmployeeCard(emp)));
  }

  function loadRoster() {
    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("PASTE_") === 0) {
      const msg = '<div class="error-state">Apps Script pas encore configuré : colle l\'URL de déploiement dans APPS_SCRIPT_URL en haut du fichier.</div>';
      employeeListSalleEl.innerHTML = msg;
      employeeListBarEl.innerHTML = msg;
      employeeListManagerEl.innerHTML = msg;
      return;
    }
    fetch(APPS_SCRIPT_URL + "?action=roster&key=" + encodeURIComponent(ACCESS_KEY))
      .then(r => r.json())
      .then(data => {
        if (data.error) {
          employeeListSalleEl.innerHTML = '<div class="error-state">' + data.error + '</div>';
          employeeListBarEl.innerHTML = '<div class="error-state">' + data.error + '</div>';
          employeeListManagerEl.innerHTML = '<div class="error-state">' + data.error + '</div>';
          return;
        }

        data = data.filter(emp => NON_HIRING_FRONT_IDS.indexOf(emp.id) === -1 && NOT_CURRENT_HIRED_IDS.indexOf(emp.id) === -1 && MERGED_DUPLICATE_IDS.indexOf(emp.id) === -1);
        data = applyDateOverrides(data);
        data = applyNameOverrides(data);
        data = applySyntheticEmployees(data);

        const manager = sortByAnciennete(data.filter(emp => isManager(emp)));
        const salle = sortByAnciennete(data.filter(emp => !isBar(emp) && !isManager(emp)));
        const bar = sortByAnciennete(data.filter(emp => isBar(emp)));

        renderList(employeeListSalleEl, salle);
        renderList(employeeListBarEl, bar);
        renderList(employeeListManagerEl, manager);
      })
      .catch(() => {
        const msg = '<div class="error-state">Connexion impossible à l\'Apps Script.</div>';
        employeeListSalleEl.innerHTML = msg;
        employeeListBarEl.innerHTML = msg;
        employeeListManagerEl.innerHTML = msg;
      });
  }

  function renderEmployeeCard(emp) {
    const a = document.createElement("a");
    a.className = "employee-card";
    a.href = "fiche.html?id=" + encodeURIComponent(emp.id);

    const main = document.createElement("div");
    main.className = "employee-main";

    const nameEl = document.createElement("div");
    nameEl.className = "employee-name";
    nameEl.textContent = emp.nom;
    main.appendChild(nameEl);

    const roleEl = document.createElement("div");
    roleEl.className = "employee-role";
    roleEl.textContent = emp.poste || "—";
    main.appendChild(roleEl);

    const metaRow = document.createElement("div");
    metaRow.className = "employee-meta";

    const dateSpan = document.createElement("span");
    dateSpan.className = "meta-item";
    dateSpan.textContent = emp.dateRecrutement
      ? "Arrivée : " + fmtDateFr(new Date(emp.dateRecrutement + "T00:00:00"))
      : "Date d'arrivée non renseignée";
    metaRow.appendChild(dateSpan);

    const essai = essaiInfo(emp);
    const essaiSpan = document.createElement("span");
    essaiSpan.className = "meta-badge " + essai.cls;
    essaiSpan.textContent = essai.label;
    metaRow.appendChild(essaiSpan);

    main.appendChild(metaRow);

    const progressEl = document.createElement("div");
    progressEl.className = "employee-progress";
    if (emp.lastValidatedBlock) {
      progressEl.innerHTML = "Dernier point validé : <strong></strong>" + (emp.nextBlock ? " · Prochain : <strong></strong>" : "");
      const strongs = progressEl.querySelectorAll("strong");
      strongs[0].textContent = emp.lastValidatedBlock;
      if (emp.nextBlock) strongs[1].textContent = emp.nextBlock;
    } else {
      progressEl.innerHTML = "Aucun point validé pour l'instant" + (emp.nextBlock ? " · À faire : <strong></strong>" : "");
      const strong = progressEl.querySelector("strong");
      if (strong) strong.textContent = emp.nextBlock;
    }
    main.appendChild(progressEl);

    a.appendChild(main);

    const arrow = document.createElement("span");
    arrow.className = "employee-arrow";
    arrow.textContent = "›";
    a.appendChild(arrow);

    return a;
  }

  loadRoster();

  // ---------- PIN gate ----------
  (function () {
    const PASSWORD = "Barcelona2025!";
    const pinScreen = document.getElementById("pinScreen");
    const pinInput = document.getElementById("pinInput");
    const pinSubmitBtn = document.getElementById("pinSubmitBtn");
    const pinErrorText = document.getElementById("pinErrorText");

    if (sessionStorage.getItem("rosario_rh_unlocked") === "1") {
      pinScreen.classList.add("hidden");
    } else {
      pinInput.focus();
    }
    function tryUnlock() {
      if (pinInput.value === PASSWORD) {
        sessionStorage.setItem("rosario_rh_unlocked", "1");
        pinScreen.classList.add("hidden");
        pinErrorText.textContent = "";
      } else {
        pinErrorText.textContent = "Code incorrect.";
        pinInput.value = "";
        pinInput.focus();
      }
    }
    pinSubmitBtn.addEventListener("click", tryUnlock);
    pinInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); tryUnlock(); } });
  })();
</script>
</body>
</html>
